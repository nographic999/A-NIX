# anix.conf - A-NIX settings, read at every shell start (before
# /etc/profile). Change them with `conf KEY VALUE` (takes effect at
# once and is saved here) or edit this file. "none" = not set.

# What the shell loads at start: on / off. off = not read at all, so it
# takes no RAM - PROFILE=off: no aliases, no saved history, PATH=/bin
# and HOME=/root; CRONTAB=off: no cron jobs (the `cron` command says
# so); HISTORY=off: no prompt history (Up/Down, !!) in RAM or saved.
# Takes effect at the next start. BOOTSEL safe mode skips the first 3.
PROFILE=on
STARTUP=on
CRONTAB=on
HISTORY=on

# WiFi (W boards): `wifi` with no arguments joins this network
WIFI_SSID=none
WIFI_PASS=none
# Radio country code, e.g. LT - needed to see channels 12-13 in Europe
WIFI_COUNTRY=none

# `date ntp`: hours to add to UTC
TZ=0

# telnetd: password for telnet logins (none = must use telnetd -p)
TELNET_PASS=none

# httpd web panel: password (none = must use httpd -p), default pins
# (none = no pins, only the file browser), and the file browser for the
# whole filesystem (on / off)
HTTPD_PASS=none
WEB_PINS=none
HTTPD_FILES=on

# I2C default pins (SDA even, SCL the next pin) and clock
I2C_SDA=4
I2C_SCL=5
I2C_FREQ=100000

# `flash` - SPI NOR chip (W25Q...) wiring: bus, pins, clock
FLASH_SPI=0
FLASH_SCK=18
FLASH_MOSI=19
FLASH_MISO=16
FLASH_CS=17
FLASH_BAUD=8000000

# Linux-style colours (prompt, ls, tree, grep, diff, errors): on / off.
# Off for a terminal that shows codes like [01;34m instead (Thonny).
COLOR=on

# System logs in /var/log: a log bigger than this (bytes) keeps its
# newest half. The background job's log may grow to 4x this.
LOG_MAX=16384

# What cron writes to /var/log/cron.log: errors = only jobs that failed
# ($? not 0), all = every run with its output, off = nothing. `cron`
# shows every job's last run and $? anyway; errors keeps a job that
# runs every minute from writing to flash every minute.
CRON_LOG=errors

# Free RAM (bytes) below which the shell unloads big unused modules
# after a command (biggest first, only as many as needed), and the
# prompt shows (low RAM)
MEM_LOW=24576

# Biggest file `edit` opens, as % of free RAM (10-90). The editor needs
# about 2x the file size plus undo and copy/paste room - higher values
# open bigger files but run out of memory sooner while editing.
EDIT_MEM=40

# Watchdog: on = the board resets itself if it locks up (8 s) - good
# for unattended boards. Takes effect at the next start (`reboot`).
# boot.py feeds it at every start, so Thonny, mpremote and uploads from
# the PC keep working. It can't be stopped once running: off, then
# `reboot`. Safe mode (BOOTSEL) skips it.
WATCHDOG=off
# also reset if the shell shows no sign of life for this many minutes:
# no prompt, no output, no command starting (sleep, watch and in -w
# count as alive; a silent program does not) - none = only lock-ups
WATCHDOG_HANG=none
